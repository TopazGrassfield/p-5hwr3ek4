<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeftBehind — 포터블 콘솔 시안 018 (원정대 상태 칸 빈자리 가운데·80%, 원정대 메뉴일 때 NO SIGNAL, 카세트 버튼 효과음)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="theme-k1">
<div id="viewport">
<div id="stage">

  <!-- 인게임 장면 (메뉴가 열리면 흐림·어둡게) -->
  <div id="bg"></div>
  <div id="shade"></div>
  <canvas id="grain" width="960" height="540"></canvas>

  <!-- 바닥 투영 빛 -->
  <div id="floor"><i class="beam"></i><i class="pool"></i><i class="refl"></i><i class="pool core"></i></div>

  <!-- 닫힌 상태: 구석의 메뉴 버튼 -->
  <button id="openBtn" class="hud-btn" aria-label="메뉴 열기"><i class="burger"></i><b>메뉴</b><kbd>Esc</kbd></button>

  <!-- 3D 장면: 떠 있는 콘솔 (평면 1640×860) -->
  <div id="scene3d">
    <div id="float">
      <div id="rise">
        <div id="screen" aria-hidden="true">

          <!-- z 0: 유리 바탕 — 콘솔 실루엣 마스크 + 가운데 화면 유리 -->
          <div class="z" id="glass" data-glass="glass">
            <i class="tint"></i><i class="w-shadow"></i><i class="sheen"></i><i class="sweep" id="sweep"></i>
          </div>

          <!-- z 2: 콘솔 실루엣 — 옅은 푸른 발광선 여러 겹 (윤곽·호·브래킷·눈금·홈) -->
          <svg class="z" id="sil" viewBox="0 0 1640 860" width="1640" height="860">
            <defs><filter id="silBlur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="5"/></filter></defs>
            <g id="decoFar"></g>
            <path id="silGlow" class="sil-glow" pathLength="1" filter="url(#silBlur)"/>
            <path id="silLine" class="sil-line" pathLength="1"/>
            <g id="decoMid"></g>
            <g id="decoNear"></g>
            <g id="scrEdge"></g>
          </svg>

          <!-- z 10: 판 위 — 원형 창이 비친 자리(소켓 링·투영 빛) + 버튼→창 전선 + 벌집 장식 -->
          <div class="z" id="L-ring">
            <i class="w-proj"></i>
            <svg id="ring" viewBox="0 0 1640 860" width="1640" height="860">
              <g id="sock"></g>
            </svg>
          </div>

          <!-- z 22: 홀로그램 글자 층 (판 위: 시계·원정대 상태·구역 이름) -->
          <div class="z" id="L-holo">
            <!-- 오른쪽 구역 위: 시계·상태 블록 (011) -->
            <div id="clock" data-glass="clock">
              <div class="ck-top"><span>원정 제12일</span><span class="ck-led"><i></i>단말 82%</span></div>
              <div class="ck-time">14:32<small>:07</small></div>
              <div class="ck-bot"><span>심도 11 · 방 3</span><span class="ck-bars"><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span></div>
            </div>
            <!-- 왼쪽 구역 아래: 원정대 상태 표시 (버튼 아님). 018: 빈자리 가운데·80% 크기, 원정대 메뉴일 때 NO SIGNAL -->
            <div id="crew" data-glass="crew" aria-label="원정대 상태"><svg class="crew-line" viewBox="0 0 246 239" aria-hidden="true"><path id="crewPath"/></svg>
              <div class="cr-sum">
                <div class="cr-head"><b>원정대 상태</b><span><i class="cr-dot hurt"></i>부상 1 · 수신 4/4</span></div>
                <ul id="crewRows"></ul>
              </div>
              <div class="cr-ns" aria-hidden="true"><canvas id="crewNoise"></canvas><i class="ns-scan"></i>
                <b class="ns-big">NO<br>SIGNAL</b><small class="ns-sub">신호 없음<br>원정대 화면 표시 중</small></div>
            </div>
            <div class="zone-tag" id="tagL"><b>L</b>원정 관리<i></i></div>
            <div class="zone-tag r" id="tagR"><i></i>기록 · 시스템<b>R</b></div>
          </div>

          <!-- z 56: 가운데 원형 창 (016) — 위아래가 평평하게 깎인 원. 판보다 한 층 앞에 떠 있음 -->
          <div class="z" id="L-win">
            <div id="win" data-glass="win"><i class="w-scan"></i><i class="w-sheen"></i></div>
            <svg id="wring" viewBox="0 0 1640 860" width="1640" height="860" aria-hidden="true">
              <defs><clipPath id="wBand"><rect id="wBandR" x="0" y="0" width="1640" height="860"/></clipPath></defs>
              <g id="wStatic"></g>
              <g clip-path="url(#wBand)"><g id="wBandStatic"></g><g id="wSpin" class="spin-win"></g></g>
            </svg>
            <div id="title" data-glass="title">
              <h1>일시정지</h1>
              <div class="t-sub">관리기구 휴대 단말 · KG-07</div>
            </div>
            <!-- 가운데 화면 (012 구조) -->
            <div id="status" data-glass="status">
              <div class="st-i"><span class="st-k">위치</span><span class="st-v"><b>심도 11</b> 방 3</span></div>
              <div class="st-i"><span class="st-k">재화</span><span class="st-v coins"><i class="c-g"></i><b>3</b>금 <i class="c-s"></i><b>4</b>은 <i class="c-c"></i><b>5</b>동</span></div>
              <div class="st-i"><span class="st-k">구조 신호</span><span class="st-v"><i class="sig-led"></i>대기</span></div>
            </div>
            <section id="panel" data-glass="panel">
              <header class="scr-head">
                <span class="scr-no" id="scrNo">01</span>
                <h2 id="scrTitle">원정대</h2>
                <span class="scr-code" id="scrCode">SQUAD</span>
                <span class="scr-live"><i></i>단말 연결</span>
              </header>
              <div class="scr-body" id="scrBody"></div>
              <footer class="scr-foot"><span id="scrFoot">심도 11 · 방 3 · 전투 차례 멈춤</span></footer>
              <i class="panel-sweep" id="pSweep"></i>
            </section>
            <div id="hints" data-glass="hints">
              <span class="kc">↑</span><span class="kc">↓</span><span class="kc">←</span><span class="kc">→</span><em>이동</em>
              <span class="kc">Enter</span><em>선택</em><span class="kc">Esc</span><em>닫기</em>
            </div>
          </div>

          <!-- z 40: 물리 버튼 층 (왼쪽 = 휜 큰 버튼 4 / 오른쪽 = 육각 6 + 돌아가기 육각) -->
          <div class="z" id="L-keys">
            <nav id="leftKeys" aria-label="주 메뉴"></nav>
            <nav id="rightKeys" aria-label="기록·시스템"></nav>
          </div>

          <!-- 기울기 측정용 모서리 점 (보이지 않음) -->
          <i class="probe" id="pTL" style="left:0;top:0"></i><i class="probe" id="pBL" style="left:0;top:858px"></i>
          <i class="probe" id="pTR" style="left:1638px;top:0"></i><i class="probe" id="pBR" style="left:1638px;top:858px"></i>
          <i class="probe" id="pC" style="left:819px;top:401px"></i>

        </div>
      </div>
    </div>
  </div>

  <div id="check" hidden></div>
</div>
</div>

<!-- 구석 조작판 (터치·마우스, 렌더 때 숨김) -->
<div id="pad" role="toolbar" aria-label="시안 조작">
  <button id="padMenu" class="pad-main">메뉴</button>
  <button data-theme="k1" title="K1 푸른색 통일">1</button>
  <button data-theme="k2" title="K2 푸른 선 + 노랑">2</button>
  <button data-theme="k3" title="K3 푸른 선 + 호박색">3</button>
  <button id="padMotion" title="움직임 켜기/끄기">움직임</button>
  <button id="padSound" title="소리 켜기/끄기 (M)">소리</button>
</div>
<script src="js/sfx.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
