<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeftBehind — 홀로그램 메뉴 시안 008</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="theme-m1">
<div id="viewport">
<div id="stage">

  <!-- 인게임 장면 (메뉴가 열리면 흐림·어둡게) -->
  <div id="bg"></div>
  <div id="shade"></div>
  <canvas id="grain" width="960" height="540"></canvas>

  <!-- 닫힌 상태: 화면 구석의 메뉴 버튼 -->
  <button id="openBtn" class="mini-blk pb" aria-label="메뉴 열기">
    <span class="face mini-face"><i class="burger"></i><b>메뉴</b><kbd>Esc</kbd></span>
  </button>

  <div id="menu" aria-hidden="true">

    <!-- 층 0: 계기판 링 (가장 깊음) -->
    <div class="layer" data-depth="0.35" id="L-ring">
      <div id="ringWrap">
        <svg id="ring" viewBox="0 0 900 900" width="900" height="900">
          <defs>
            <path id="codePath" d="M450,450 m-372,0 a372,372 0 1,1 744,0 a372,372 0 1,1 -744,0"/>
            <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
              <stop offset="62%" stop-color="var(--holo)" stop-opacity="0"/>
              <stop offset="80%" stop-color="var(--holo)" stop-opacity="0.05"/>
              <stop offset="100%" stop-color="var(--holo)" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="450" cy="450" r="440" fill="url(#ringGlow)"/>
          <circle class="hl" cx="450" cy="450" r="436" stroke-width="1" opacity=".45"/>
          <g id="ticks" class="spin-slow"></g>
          <g class="spin-rev">
            <circle class="acc-arc" cx="450" cy="450" r="421" stroke-width="3" stroke-dasharray="120 540 46 1940"/>
            <circle class="hl" cx="450" cy="450" r="421" stroke-width="1" stroke-dasharray="2 10" opacity=".35"/>
          </g>
          <g class="spin-code">
            <text class="code-ring"><textPath href="#codePath">관리기구 공용 단말 KG-07 · 원정 일시정지 · 심도 11.2 KM · 구조 신호 대기 · 착륙지 연결 유지 · 기록 동기화 0003 · 관리기구 공용 단말 KG-07 · 원정 일시정지 · 심도 11.2 KM ·</textPath></text>
          </g>
          <circle class="hl flow" cx="450" cy="450" r="342" stroke-width="1" stroke-dasharray="1 7" opacity=".55"/>
          <circle class="hl" cx="450" cy="450" r="300" stroke-width="1" opacity=".12"/>
          <g class="cross" opacity=".6">
            <path d="M450 2 v18 M450 880 v18 M2 450 h18 M880 450 h18"/>
            <path d="M136 136 l10 10 M764 136 l-10 10 M136 764 l10 -10 M764 764 l-10 -10"/>
          </g>
        </svg>
        <!-- 심도 눈금 (링 오른쪽) -->
        <div id="depthGauge">
          <div class="dg-title">심도 <b>KM</b></div>
          <div class="dg-scale" id="dgScale"></div>
          <div class="dg-mark" style="--v:11.2"><span>11.2</span></div>
        </div>
      </div>
    </div>

    <!-- 층 1: 홀로그램 화면 -->
    <div class="layer" data-depth="0.6" id="L-screen">
      <section id="screen" data-panel="screen">
        <div class="scr-frame">
          <i class="cn tl"></i><i class="cn tr"></i><i class="cn bl"></i><i class="cn br"></i>
        </div>
        <header class="scr-head">
          <span class="scr-no" id="scrNo">01</span>
          <h2 id="scrTitle">원정대</h2>
          <span class="scr-code" id="scrCode">SQUAD // 대원 4 · 다운 0</span>
          <span class="scr-live"><i></i>단말 연결</span>
        </header>
        <div class="scr-body" id="scrBody"></div>
        <footer class="scr-foot">
          <span id="scrFoot">감염 구역 · 심도 11 · 방 3 · 전투 방</span>
          <span class="tmp">보기용 임시 값</span>
        </footer>
        <div class="scan-sweep" id="sweep"></div>
        <div class="scanlines"></div>
      </section>
    </div>

    <!-- 층 2: 물리 버튼 (가장 앞) -->
    <div class="layer" data-depth="1" id="L-front">
      <div id="titlePlate" class="plate pb" data-panel="title">
        <div class="face tp-face">
          <span class="tp-led"></span>
          <h1>일시정지</h1>
          <div class="tp-sub"><b>관리기구 공용 단말</b><span>KG-07 · 원정 중 호출</span></div>
          <span class="tp-screw s1"></span><span class="tp-screw s2"></span>
        </div>
      </div>

      <nav id="nav" aria-label="메뉴"></nav>

      <aside id="side">
        <div class="sblk pb" data-panel="s-depth">
          <div class="face s-face">
            <span class="s-k">위치</span>
            <div class="s-big"><small>심도</small>11</div>
            <span class="s-v">감염 구역 · 방 3</span>
          </div>
        </div>
        <div class="sblk pb" data-panel="s-time">
          <div class="face s-face">
            <span class="s-k">원정 시간</span>
            <div class="s-mid">제12일 <b>14:32</b></div>
            <span class="s-v">착륙 후 1시간 20분</span>
          </div>
        </div>
        <div class="sblk pb" data-panel="s-coin">
          <div class="face s-face">
            <span class="s-k">재화</span>
            <div class="s-coins"><span><i class="c-g"></i>3<em>금</em></span><span><i class="c-s"></i>4<em>은</em></span><span><i class="c-c"></i>5<em>동</em></span></div>
          </div>
        </div>
        <div class="sblk pb" data-panel="s-sig">
          <div class="face s-face">
            <span class="s-k">구조 신호</span>
            <div class="s-sig"><i class="sig-led"></i>대기<span class="sig-bars"><i></i><i></i><i></i><i></i></span></div>
          </div>
        </div>
      </aside>

      <div id="bottomBar" class="plate pb" data-panel="bottom">
        <div class="face bb-face">
          <span class="keycap"><kbd>↑</kbd><kbd>↓</kbd></span><span class="bb-t">이동</span>
          <span class="keycap"><kbd class="w">Enter</kbd></span><span class="bb-t">선택</span>
          <span class="keycap"><kbd class="w">Esc</kbd></span><span class="bb-t">닫기</span>
          <span class="bb-sep"></span>
          <span class="bb-note">전투 차례는 멈춰 있습니다</span>
        </div>
      </div>
      <button id="closeBtn" class="mini-blk pb" aria-label="메뉴 닫기" data-panel="close">
        <span class="face mini-face"><b>돌아가기</b><kbd>Esc</kbd></span>
      </button>
    </div>
  </div>

  <!-- 시안 전환 (렌더 때는 숨김) -->
  <div id="tweaks">
    <span class="tw-k">시안</span>
    <button data-theme="m1">1 노랑</button>
    <button data-theme="m2">2 코발트</button>
    <button data-theme="m3">3 호박·청록</button>
    <span class="tw-sep"></span>
    <button id="twMotion" title="움직임 켜기/끄기">움직임</button>
  </div>
  <div id="check" hidden></div>
</div>
</div>
<script src="js/menu.js"></script>
</body>
</html>
