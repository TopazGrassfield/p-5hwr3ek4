<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LeftBehind — 포터블 콘솔 화면 시안 012 (가운데 화면 + 좌우 육각 버튼)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="css/menu.css">
</head>
<body class="theme-k1">
<div id="viewport">
<div id="stage">

  <!-- 인게임 장면 (메뉴가 열리면 흐림·어둡게) -->
  <div id="bg"></div>
  <div id="shade"></div>
  <canvas id="grain" width="960" height="540"></canvas>

  <!-- 바닥 투영 빛 (콘솔이 떠 있음을 암시) -->
  <div id="floor"><i class="beam"></i><i class="pool"></i><i class="refl"></i><i class="pool core"></i></div>

  <!-- 닫힌 상태: 구석의 메뉴 버튼 -->
  <button id="openBtn" class="hud-btn" aria-label="메뉴 열기"><i class="burger"></i><b>메뉴</b><kbd>Esc</kbd></button>

  <!-- 3D 장면: 떠 있는 포터블 콘솔 (왼쪽 버튼 구역 | 가운데 화면 | 오른쪽 버튼 구역) — 내부 좌표 1600×760 -->
  <div id="scene3d">
    <div id="float">
      <div id="rise">
        <div id="screen" aria-hidden="true">

          <!-- z 0: 유리 바탕 (반투명). 콘솔 윤곽으로 잘림, 가운데 화면 구역은 조금 더 어두운 유리 -->
          <div class="z" id="glass" data-glass="glass">
            <div class="gshape">
              <i class="sheen"></i><i class="scanlines"></i>
              <i class="scr-glass"></i>
              <i class="sweep" id="sweep"></i>
            </div>
          </div>

          <!-- z 3: 빛의 선 프레임 — 세 구역 전체를 감싸는 가로로 긴 콘솔 윤곽(양옆 손잡이 쪽이 둥글게 넓어짐) + 안쪽 화면 구분선 -->
          <svg class="z" id="frame" viewBox="0 0 1600 760" width="1600" height="760">
            <defs>
              <filter id="fglow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3"/></filter>
            </defs>
            <g class="edges-glow" filter="url(#fglow)">
              <path class="edge" pathLength="1" d="M0 380 V80 A80 80 0 0 1 80 0 H150 C220 0 240 20 300 20 H800"/>
              <path class="edge" pathLength="1" d="M1600 380 V80 A80 80 0 0 0 1520 0 H1450 C1380 0 1360 20 1300 20 H800"/>
              <path class="edge" pathLength="1" d="M0 380 V680 A80 80 0 0 0 80 760 H150 C220 760 240 740 300 740 H800"/>
              <path class="edge" pathLength="1" d="M1600 380 V680 A80 80 0 0 1 1520 760 H1450 C1380 760 1360 740 1300 740 H800"/>
            </g>
            <g class="edges">
              <path class="edge" pathLength="1" d="M0 380 V80 A80 80 0 0 1 80 0 H150 C220 0 240 20 300 20 H800"/>
              <path class="edge" pathLength="1" d="M1600 380 V80 A80 80 0 0 0 1520 0 H1450 C1380 0 1360 20 1300 20 H800"/>
              <path class="edge" pathLength="1" d="M0 380 V680 A80 80 0 0 0 80 760 H150 C220 760 240 740 300 740 H800"/>
              <path class="edge" pathLength="1" d="M1600 380 V680 A80 80 0 0 1 1520 760 H1450 C1380 760 1360 740 1300 740 H800"/>
            </g>
            <g class="brackets">
              <path class="bk" d="M0 150 V80 A80 80 0 0 1 80 0 H150"/>
              <path class="bk" d="M1450 0 H1520 A80 80 0 0 1 1600 80 V150"/>
              <path class="bk" d="M1600 610 V680 A80 80 0 0 1 1520 760 H1450"/>
              <path class="bk" d="M150 760 H80 A80 80 0 0 1 0 680 V610"/>
            </g>
            <!-- 화면 구역 구분선 (옅게) + 모서리 꺾쇠 -->
            <rect class="sline" pathLength="1" x="362" y="40" width="876" height="680" rx="16"/>
            <g class="sbk">
              <path d="M362 84 V56 A16 16 0 0 1 378 40 H406"/>
              <path d="M1194 40 H1222 A16 16 0 0 1 1238 56 V84"/>
              <path d="M1238 676 V704 A16 16 0 0 1 1222 720 H1194"/>
              <path d="M406 720 H378 A16 16 0 0 1 362 704 V676"/>
            </g>
            <g class="marks">
              <path d="M0 356 v48 M1600 356 v48"/>
              <path d="M770 740 h60"/>
            </g>
            <text class="flabel" x="800" y="22" text-anchor="middle">관리기구 휴대 단말 · KG-07</text>
            <path id="flow" class="flow" pathLength="1" d="M300 20 H1300 C1360 20 1380 0 1450 0 H1520 A80 80 0 0 1 1600 80 V680 A80 80 0 0 1 1520 760 H1450 C1380 760 1360 740 1300 740 H300 C240 740 220 760 150 760 H80 A80 80 0 0 1 0 680 V80 A80 80 0 0 1 80 0 H150 C220 0 240 20 300 20 Z"/>
          </svg>

          <!-- z 10: 계기판 링(화면 뒤) + 벌집 바탕(소켓 윤곽·장식 육각·노드·연결선) -->
          <div class="z" id="L-ring">
            <div id="ringWrap">
              <svg id="ring" viewBox="0 0 900 900" width="560" height="560">
                <defs>
                  <path id="codePath" d="M450,450 m-372,0 a372,372 0 1,1 744,0 a372,372 0 1,1 -744,0"/>
                </defs>
                <circle class="hl" cx="450" cy="450" r="436" stroke-width="1.4" opacity=".35"/>
                <g id="ticks" class="spin-slow"></g>
                <g class="spin-rev">
                  <circle class="acc-arc" cx="450" cy="450" r="421" stroke-width="4" stroke-dasharray="120 540 46 1940"/>
                  <circle class="hl" cx="450" cy="450" r="421" stroke-width="1.4" stroke-dasharray="2 10" opacity=".3"/>
                </g>
                <g class="spin-code">
                  <text class="code-ring"><textPath href="#codePath">원정 일시정지 · 심도 11.2 KM · 구조 신호 대기 · 착륙지 연결 유지 · 기록 동기화 0003 · 원정 일시정지 · 심도 11.2 KM · 구조 신호 대기 ·</textPath></text>
                </g>
              </svg>
            </div>
            <svg id="hexNet" viewBox="0 0 1600 760" width="1600" height="760"></svg>
          </div>

          <!-- z 22: 홀로그램 글자 층 -->
          <div class="z" id="L-holo">
            <!-- 가운데 화면 -->
            <div id="status" data-glass="status">
              <div class="st-i"><span class="st-k">위치</span><span class="st-v"><b>심도 11</b> 감염 구역 · 방 3</span></div>
              <div class="st-i"><span class="st-k">원정</span><span class="st-v">제12일 <b>14:32</b></span></div>
              <div class="st-i"><span class="st-k">재화</span><span class="st-v coins"><i class="c-g"></i><b>3</b>금 <i class="c-s"></i><b>4</b>은 <i class="c-c"></i><b>5</b>동</span></div>
              <div class="st-i"><span class="st-k">구조 신호</span><span class="st-v"><i class="sig-led"></i>대기</span></div>
            </div>
            <section id="panel" data-glass="panel">
              <header class="scr-head">
                <span class="scr-no" id="scrNo">01</span>
                <h2 id="scrTitle">원정대</h2>
                <span class="scr-code" id="scrCode">SQUAD</span>
                <span class="scr-live"><i></i>단말 연결</span>
              </header>
              <div class="scr-body" id="scrBody"></div>
              <footer class="scr-foot"><span id="scrFoot">감염 구역 · 심도 11 · 방 3 · 전투 방</span><span class="tmp">보기용 임시 값</span></footer>
              <i class="panel-sweep" id="pSweep"></i>
            </section>
            <div id="hints" data-glass="hints">
              <span class="kc">↑</span><span class="kc">↓</span><em>구역 안</em>
              <span class="kc">←</span><span class="kc">→</span><em>좌우 구역</em>
              <span class="kc w">Enter</span><em>선택</em>
              <span class="kc w">Esc</span><em>닫기</em>
              <span class="h-sep"></span><span class="h-note">전투 차례 멈춤</span>
            </div>
            <!-- 좌우 구역 이름·단말 상태 -->
            <div class="zone-tag" id="tagL"><i></i>원정 관리<b>L</b></div>
            <div class="zone-tag r" id="tagR"><b>R</b>기록 · 시스템<i></i></div>
            <div id="power" data-glass="power">
              <span class="pw-k">단말 전력</span>
              <span class="pw-cells"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span>
              <b>82%</b>
            </div>
          </div>

          <!-- z 46: 물리 버튼 층 (가장 앞) -->
          <div class="z" id="L-keys">
            <div id="titlePlate" class="pb plate" data-panel="title">
              <span class="sock"></span><span class="edge"></span>
              <span class="face tp-face">
                <span class="tp-led"></span>
                <h1>일시정지</h1>
                <span class="tp-sub"><b>원정 중</b><span>KG-07</span></span>
              </span>
            </div>
            <nav id="hexes" aria-label="메뉴"></nav>
            <button id="closeBtn" class="pb mini" data-panel="close" aria-label="메뉴 닫기">
              <span class="sock"></span><span class="edge"></span>
              <span class="face mini-face"><b>돌아가기</b><kbd>Esc</kbd></span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="check" hidden></div>
</div>
</div>

<!-- 구석 조작판 (터치·마우스, 렌더 때 숨김) -->
<div id="pad" role="toolbar" aria-label="시안 조작">
  <button id="padMenu" class="pad-main">메뉴</button>
  <button data-theme="k1" title="K1 푸른색 통일">1</button>
  <button data-theme="k2" title="K2 푸른 선 + 노랑">2</button>
  <button data-theme="k3" title="K3 푸른 선 + 호박색">3</button>
  <button id="padMotion" title="움직임 켜기/끄기">움직임</button>
</div>
<script src="js/menu.js"></script>
</body>
</html>
